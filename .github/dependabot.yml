version: 2

updates:
  - package-ecosystem: "cargo"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
    groups:
      cargo-version-updates:
        patterns:
          - "*"
      cargo-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "rand"
        # Breaking API change which breaks builds
        versions: [">= 0.10.0"]
  
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
    groups:
      github-actions-version-updates:
        patterns:
          - "*"
      github-actions-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  
  - package-ecosystem: "uv"
    directories:
      - "/"
      - "/zixy-py/docs/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
    groups:
      uv-version-updates:
        patterns:
          - "*"
      uv-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
