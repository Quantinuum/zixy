version: 2

updates:
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/zixy/"
      - "/zixy-py/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      cargo-version-updates:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      github-actions-version-updates:
        patterns:
          - "*"
  - package-ecosystem: "uv"
    directories:
      - "/"
      - "/zixy-py/"
      - "/zixy-py/docs/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      uv-version-updates:
        patterns:
          - "*"