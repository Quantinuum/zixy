name: Release

on:
  pull_request:
    branches: [main]  # Dry-run only
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

env:
  MODULE_DIR: zixy-py

jobs:
  # Check if the tag matches the package name,
  # or if the workflow is running on a non-release event.
  check-tag:
    name: Check tag
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.check-tag.outputs.run }}
      publish: ${{ (github.event_name == 'release' || github.event_name == 'workflow_dispatch') && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Check tag
        id: check-tag
        run: |
          echo "run=$SHOULD_RUN" >> $GITHUB_OUTPUT
        env:
          SHOULD_RUN: ${{ github.event_name != 'release' || ( github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') ) }}

  linux:
    needs: check-tag
    if: ${{ needs.check-tag.outputs.run == 'true' }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-24.04
            target: x86_64
            manylinux: "manylinux_2_28"
          - runner: ubuntu-24.04
            target: x86
            manylinux: "manylinux_2_28"
          - runner: ubuntu-24.04
            target: aarch64
            manylinux: "manylinux_2_28"
          - runner: ubuntu-24.04
            target: armv7
            manylinux: "manylinux_2_28"
          - runner: ubuntu-24.04
            target: s390x
            manylinux: "manylinux_2_28"
          - runner: ubuntu-24.04
            target: ppc64le
            manylinux: "manylinux_2_28"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.MODULE_DIR }}
          target: ${{ matrix.platform.target }}
          args: --release --out ../dist --find-interpreter
          sccache: 'false'
          manylinux: ${{ matrix.platform.manylinux }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  musllinux:
    needs: check-tag
    if: ${{ needs.check-tag.outputs.run == 'true' }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-24.04
            target: x86_64
          - runner: ubuntu-24.04
            target: x86
          - runner: ubuntu-24.04
            target: aarch64
          - runner: ubuntu-24.04
            target: armv7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.MODULE_DIR }}
          target: ${{ matrix.platform.target }}
          args: --release --out ../dist --find-interpreter
          sccache: 'false'
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  windows:
    needs: check-tag
    if: ${{ needs.check-tag.outputs.run == 'true' }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
          - runner: windows-latest
            target: x86
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
          architecture: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.MODULE_DIR }}
          target: ${{ matrix.platform.target }}
          args: --release --out ../dist --find-interpreter
          sccache: 'false'
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    needs: check-tag
    if: ${{ needs.check-tag.outputs.run == 'true' }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15
            target: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.MODULE_DIR }}
          target: ${{ matrix.platform.target }}
          args: --release --out ../dist --find-interpreter
          sccache: 'false'
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    needs: check-tag
    if: ${{ needs.check-tag.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.MODULE_DIR }}
          command: sdist
          args: --out ../dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  wasm:
    name: Build Pyodide wheel
    needs: check-tag
    if: ${{ needs.check-tag.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Match the Pyodide 0.29 runtime and use hugr's nightly toolchain.
      PYTHON_VERSION: "3.13"
      EMSDK_VERSION: "4.0.9"
      RUST_NIGHTLY_VERSION: nightly-2026-05-28
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY_VERSION }}
          targets: wasm32-unknown-emscripten
          components: rust-src
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Set up Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install "$EMSDK_VERSION"
          ./emsdk activate "$EMSDK_VERSION"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.5"
      - name: Build Pyodide wheel
        working-directory: ${{ env.MODULE_DIR }}
        env:
          CARGO_BUILD_TARGET: wasm32-unknown-emscripten
          TARGET: wasm32-unknown-emscripten
          CFLAGS: -fPIC
          CXXFLAGS: -fPIC
        run: |
          source ../emsdk/emsdk_env.sh
          # Rebuild Rust's standard library with Pyodide's Emscripten version.
          uvx --from 'maturin~=1.15.0' maturin build \
            -Z build-std --locked --release \
            --interpreter "python$PYTHON_VERSION" --target "$TARGET" \
            --out ../wasm-dist
      - name: Smoke-test the wheel in Pyodide
        run: |
          npm install --prefix "$RUNNER_TEMP/pyodide" --no-audit --no-fund pyodide@0.29.3
          NODE_PATH="$RUNNER_TEMP/pyodide/node_modules" node - "$PWD"/wasm-dist/*.whl <<'JS'
          const { loadPyodide } = require("pyodide");

          async function main() {
            const pyodide = await loadPyodide();
            const options = { errorCallback: (message) => { throw new Error(message); } };
            // Use the runtime's bundled dependencies to check the extension ABI.
            await pyodide.loadPackage(["pandas", "sympy", "typing-extensions"], options);
            await pyodide.loadPackage(process.argv[2], options);
            pyodide.runPython(`
          from zixy.qubit.pauli import String, X
          assert String(1, (X,)).get_tuple() == (X,)
          `);
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          JS
      - name: Upload Pyodide wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-wasm
          path: wasm-dist/zixy-*-emscripten_4_0_9_wasm32.whl
          if-no-files-found: error

  dry-run:
    name: Release dry run
    needs: [check-tag, linux, musllinux, windows, macos, sdist, wasm]
    if: ${{ needs.check-tag.outputs.publish == 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Report
        run: echo "All wheel and source distribution builds passed." >> "$GITHUB_STEP_SUMMARY"

  release-crate:
    name: Release to crates.io
    needs: [check-tag, linux, musllinux, windows, macos, sdist]
    if: ${{ needs.check-tag.outputs.publish == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release_crate.yml

  release:
    name: Release wheels
    runs-on: ubuntu-24.04
    needs: [check-tag, linux, musllinux, windows, macos, sdist, wasm]
    if: ${{ needs.check-tag.outputs.publish == 'true' }}
    environment: release
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheels-{linux-*,musllinux-*,windows-*,macos-*,sdist}
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: wheels-wasm
          path: wasm-dist
      - name: Report
        run: |
          echo "Publishing to PyPI..."
          echo "Based on the following workflow variables, this is a new version tag push:"
          echo "  - event_name: ${{ github.event_name }}"
          echo "  - ref_type: ${{ github.ref_type }}"
          echo "  - ref: $GITHUB_REF"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          skip-existing: true
      - name: Attach the Pyodide wheel to the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: wasm-dist/*.whl
          fail_on_unmatched_files: true
          overwrite_files: false
