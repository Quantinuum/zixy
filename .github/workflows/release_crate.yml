name: Release Rust crate

on:
  workflow_call:

permissions:
  contents: read

env:
  CRATE_DIR: zixy

jobs:
  release-crate:
    name: Release Rust crate
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'release' || github.event_name == 'workflow_dispatch') && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') }}
    environment: release
    permissions:
      # Required for crates.io trusted publishing.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Report
        run: |
          echo "Publishing Rust crate from '${{ env.CRATE_DIR }}' to crates.io..."
          echo "  - event_name: ${{ github.event_name }}"
          echo "  - ref_type: ${{ github.ref_type }}"
          echo "  - ref: ${{ github.ref }}"
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        working-directory: ${{ env.CRATE_DIR }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
