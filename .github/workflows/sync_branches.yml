name: Sync branches

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  backmerge:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create PR from main to develop
        run: |
          if gh pr list --base develop --head main --state open --json number --jq length | grep -q '^0$'; then
            gh pr create \
              --base develop \
              --head main \
              --title "chore: back-merge main into develop" \
              --body "Back merge \`main\` into \`develop\`."
            gh pr edit main \
              --base develop \
              --add-label "back-merge"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
