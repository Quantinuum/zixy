[tool.uv.workspace]
members = ["zixy-py"]

[tool.uv]
dev-dependencies = [
    "maturin>=1.7.0,<2",
    "pytest>=9.0.0",
    "pytest-cov >=5.0.0,<6",
    "ruff>=0.17",
    "mypy>=2.3.0",
    "pandas-stubs>=2.0.0",
    "pip>=24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.maturin]
# Maturin is not the build system for the workspace (it is only used for `zixy-py`).
# We mirror the `zixy-py/pyproject.toml` config here so `maturin develop` still works
# from the root of the workspace.
manifest-path = "zixy-py/Cargo.toml"
python-source = "zixy-py"
module-name = "zixy._zixy"
features = ["pyo3/extension-module"]

[tool.mypy]
exclude = '''(?x)(
    ^target/        # Build artifacts
    | ^notebooks/   # Examples
    | ^test_files/  # Test files
)'''

[tool.coverage.report]
exclude_also = [
    # Don't complain about missing coverage on typing imports
    "if TYPE_CHECKING:",
    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",
    "raise InternalGuppyError",
    # Don't complain about abstract methods, they aren't run:
    "@abstractmethod",
]
